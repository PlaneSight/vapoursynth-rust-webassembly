# Dependency updates arrive as ordinary pull requests and must pass the
# same canonical-command baseline as any other change (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
