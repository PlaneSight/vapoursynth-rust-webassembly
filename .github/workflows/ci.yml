name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: 1.85.0
  EMSCRIPTEN_VERSION: 3.1.68

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync UV tools
        run: uv sync --locked
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web test dependencies
        run: uv run --locked bash -lc 'npm ci'
      # Cache keys include the pinned compiler and dependency lockfile.
      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_VERSION }}-native-
      - name: Format
        run: uv run --locked cargo fmt --all --check
      - name: Clippy
        run: uv run --locked cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: uv run --locked cargo test --locked --workspace
      - name: Test worker runtime
        run: uv run --locked node --test web/*.test.mjs
      - name: Test Python authoring package
        run: uv run --locked python -m unittest discover -s web/python -p test_*.py
      - name: Compile isolated wasm-bindgen scaffold
        run: uv run --locked cargo check --locked -p vapoursynth-wasm-host --target wasm32-unknown-unknown

  browser-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      EMSDK: ${{ github.workspace }}/.ci/emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync UV tools
        run: uv sync --locked
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
          targets: wasm32-unknown-emscripten
      - name: Restore browser toolchain cache
        id: browser-toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/emsdk
          key: browser-toolchain-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('uv.lock') }}
      - name: Restore Emscripten Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-emscripten-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_VERSION }}-emscripten-
      - name: Install Emscripten
        if: steps.browser-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$EMSDK")"
          git clone --branch "$EMSCRIPTEN_VERSION" --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSCRIPTEN_VERSION"
          "$EMSDK/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Activate Emscripten
        run: |
          "$EMSDK/emsdk" activate "$EMSCRIPTEN_VERSION"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Lint Emscripten Rust ownership layer
        run: |
          source "$EMSDK/emsdk_env.sh"
          RUSTFLAGS=-Cpanic=abort uv run --locked cargo clippy --locked -p vapoursynth-core --target wasm32-unknown-emscripten -- -D warnings
      - name: Verify Emscripten executable wrapper
        run: |
          source "$EMSDK/emsdk_env.sh"
          printf 'int main(void) { return 0; }\n' > /tmp/emscripten-wrapper-probe.cc
          em++ /tmp/emscripten-wrapper-probe.cc -o /tmp/emscripten-wrapper-probe.exe
          toolchains/emscripten-node /tmp/emscripten-wrapper-probe.exe
      - name: Build upstream browser smoke
        run: |
          source "$EMSDK/emsdk_env.sh"
          bash toolchains/emscripten-node.test.sh
          if ! uv run --locked bash tools/build-browser.sh; then
            cat build/browser/meson-logs/meson-log.txt
            exit 1
          fi
