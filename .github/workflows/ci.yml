name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Compile isolated wasm-bindgen scaffold
        run: cargo check --locked -p vapoursynth-wasm-host --target wasm32-unknown-unknown

  browser-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
          targets: wasm32-unknown-emscripten
      - name: Install Meson
        run: |
          python3 -m pip install --user meson==1.3.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Emscripten 3.1.68
        run: |
          git clone --branch 3.1.68 --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.68
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.68
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Lint Emscripten Rust probe
        run: RUSTFLAGS=-Cpanic=abort cargo clippy --locked -p vapoursynth-emscripten-probe --target wasm32-unknown-emscripten -- -D warnings
      - name: Build upstream browser smoke
        run: tools/build-browser.sh
