name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: 1.85.0
  EMSCRIPTEN_VERSION: 3.1.68

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Test web
        run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync UV tools
        run: uv sync --locked
      - name: Test Python
        run: uv run --locked python -m unittest discover -s web/python -p 'test_*.py'

  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      EMSDK: ${{ github.workspace }}/.ci/emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync UV tools
        run: uv sync --locked
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - name: Restore browser toolchain cache
        id: browser-toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/emsdk
          key: browser-toolchain-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('uv.lock') }}
      - name: Install Emscripten
        if: steps.browser-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$EMSDK")"
          git clone --branch "$EMSCRIPTEN_VERSION" --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSCRIPTEN_VERSION"
          "$EMSDK/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Activate Emscripten
        run: |
          "$EMSDK/emsdk" activate "$EMSCRIPTEN_VERSION"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Lint Emscripten Rust ownership layer
        run: |
          source "$EMSDK/emsdk_env.sh"
          RUSTFLAGS=-Cpanic=abort cargo clippy --locked -p vapoursynth-core --target wasm32-unknown-emscripten -- -D warnings
      - name: Verify Emscripten executable wrapper
        run: |
          source "$EMSDK/emsdk_env.sh"
          printf 'int main(void) { return 0; }\n' > /tmp/emscripten-wrapper-probe.cc
          em++ /tmp/emscripten-wrapper-probe.cc -o /tmp/emscripten-wrapper-probe.exe
          toolchains/emscripten-node /tmp/emscripten-wrapper-probe.exe
      - name: Build upstream browser integration
        run: |
          source "$EMSDK/emsdk_env.sh"
          bash toolchains/emscripten-node.test.sh
          if ! bash tools/build-browser.sh; then
            cat build/emscripten/meson-logs/meson-log.txt
            exit 1
          fi
          test -f build/web/runtime/vapoursynth-browser-module.js
          test -f build/web/runtime/vapoursynth-browser-module.wasm
