name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: 1.85.0
  EMSCRIPTEN_VERSION: 3.1.68
  MESON_VERSION: 1.3.2

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web test dependencies
        run: npm ci
      # Cache keys include the pinned compiler and dependency lockfile.
      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_VERSION }}-native-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Test worker runtime
        run: npm run test:web
      - name: Test Python authoring package
        run: npm run test:python
      - name: Compile isolated wasm-bindgen scaffold
        run: cargo check --locked -p vapoursynth-wasm-host --target wasm32-unknown-unknown

  browser-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      EMSDK: ${{ github.workspace }}/.ci/emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
          targets: wasm32-unknown-emscripten
      - name: Restore browser toolchain cache
        id: browser-toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/emsdk
            ~/.cache/pip
          key: browser-toolchain-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-meson-${{ env.MESON_VERSION }}
      - name: Restore Emscripten Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-emscripten-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_VERSION }}-emscripten-
      - name: Install Meson
        run: |
          python3 -m pip install --user "meson==$MESON_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Emscripten
        if: steps.browser-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$EMSDK")"
          git clone --branch "$EMSCRIPTEN_VERSION" --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSCRIPTEN_VERSION"
          "$EMSDK/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Activate Emscripten
        run: |
          "$EMSDK/emsdk" activate "$EMSCRIPTEN_VERSION"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Lint Emscripten Rust ownership layer
        run: |
          source "$EMSDK/emsdk_env.sh"
          RUSTFLAGS=-Cpanic=abort cargo clippy --locked -p vapoursynth-core --target wasm32-unknown-emscripten -- -D warnings
      - name: Verify Emscripten sanity wrapper
        run: |
          source "$EMSDK/emsdk_env.sh"
          printf 'int main(void) { return 0; }\n' > /tmp/meson-sanity.cpp
          em++ /tmp/meson-sanity.cpp -o /tmp/meson-sanity.exe
          file /tmp/meson-sanity.exe
          node /tmp/meson-sanity.exe
      - name: Build upstream browser smoke
        run: |
          source "$EMSDK/emsdk_env.sh"
          tools/build-browser.sh
